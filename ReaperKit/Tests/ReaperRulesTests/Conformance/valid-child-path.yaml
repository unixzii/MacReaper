description: "A contains entry with a slash is a literal relative path."
expect: valid
files:
  rule-sets/t.yaml: |
    format: 1
    id: t
    title: T
    description: Test rule set.

    categories:
      c:
        title: C
        safety: review

    rules:
      - id: t.project
        when:
          contains: x
        action:
          pushScope:
            name: project
            set:
              project: "{name}"

      - id: t.claim
        when:
          name: a
          scope: { name: project, distance: 1 }
        action:
          claim: c

      - id: t.extra
        when: { contains: "ProjectSettings/ProjectVersion.txt" }
        action: { claim: c }

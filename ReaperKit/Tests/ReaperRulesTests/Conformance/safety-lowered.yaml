description: "A profile may not make a category less strict."
expect:
  code: safety-lowered
  file: profiles/p.yaml
  line: 9
files:
  profiles/p.yaml: |
    format: 1
    id: p
    title: P
    roots: ["~"]
    maxDepth: 3
    ruleSets: [t]
    preselect: [safe]
    categorySafety:
      t.c: safe
  rule-sets/t.yaml: |
    format: 1
    id: t
    title: T
    description: Test rule set.

    categories:
      c:
        title: C
        safety: review

    rules:
      - id: t.project
        when:
          contains: x
        action:
          pushScope:
            name: project
            set:
              project: "{name}"

      - id: t.claim
        when:
          name: a
          scope: { name: project, distance: 1 }
        action:
          claim: c

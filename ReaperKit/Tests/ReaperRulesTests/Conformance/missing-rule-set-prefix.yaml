description: "Rule ids start with their rule set's id."
expect:
  code: missing-rule-set-prefix
  file: rule-sets/t.yaml
  line: 28
files:
  rule-sets/t.yaml: |
    format: 1
    id: t
    title: T
    description: Test rule set.

    categories:
      c:
        title: C
        safety: review

    rules:
      - id: t.project
        when:
          contains: x
        action:
          pushScope:
            name: project
            set:
              project: "{name}"

      - id: t.claim
        when:
          name: a
          scope: { name: project, distance: 1 }
        action:
          claim: c

      - id: x.extra
        when: { name: z }
        action: { claim: c }

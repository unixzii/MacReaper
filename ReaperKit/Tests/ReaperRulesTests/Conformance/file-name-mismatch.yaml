description: "A rule set's id equals its file name."
expect:
  code: file-name-mismatch
  file: rule-sets/u.yaml
  line: 2
files:
  rule-sets/u.yaml: |
    format: 1
    id: t
    title: T
    description: Test rule set.

    categories:
      c:
        title: C
        safety: review

    rules:
      - id: t.project
        when:
          contains: x
        action:
          pushScope:
            name: project
            set:
              project: "{name}"

      - id: t.claim
        when:
          name: a
          scope: { name: project, distance: 1 }
        action:
          claim: c

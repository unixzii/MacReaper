description: "A rule set may use another rule set's scope and category."
expect: valid
files:
  rule-sets/o.yaml: |
    format: 1
    id: o
    title: O
    description: Other rule set.

    categories:
      oc:
        title: OC
        safety: safe

    rules:
      - id: o.project
        when:
          contains: y
        action:
          pushScope: project
  rule-sets/t.yaml: |
    format: 1
    id: t
    title: T
    description: Test rule set.

    categories:
      c:
        title: C
        safety: review

    rules:
      - id: t.project
        when:
          contains: x
        action:
          pushScope:
            name: project
            set:
              project: "{name}"

      - id: t.claim
        when:
          name: a
          scope: { name: project, distance: 1 }
        action:
          claim: c

      - id: t.extra
        when: { name: z, scope: o.project }
        action: { claim: o.oc }

description: "Using another rule set's category needs requires."
expect:
  code: missing-requires
  file: rule-sets/t.yaml
  line: 30
files:
  profiles/p.yaml: |
    format: 1
    id: p
    title: P
    roots: ["~"]
    maxDepth: 3
    ruleSets: [t, o]
    preselect: [safe]
  rule-sets/o.yaml: |
    format: 1
    id: o
    title: O
    description: Other rule set.

    categories:
      oc:
        title: OC
        safety: safe

    rules:
      - id: o.project
        when:
          contains: y
        action:
          pushScope: project
  rule-sets/t.yaml: |
    format: 1
    id: t
    title: T
    description: Test rule set.

    categories:
      c:
        title: C
        safety: review

    rules:
      - id: t.project
        when:
          contains: x
        action:
          pushScope:
            name: project
            set:
              project: "{name}"

      - id: t.claim
        when:
          name: a
          scope: { name: project, distance: 1 }
        action:
          claim: c

      - id: t.extra
        when: { name: z }
        action: { claim: o.oc }

description: "Scope variables need a scope test."
expect:
  code: unavailable-variable
  file: rule-sets/t.yaml
  line: 30
files:
  rule-sets/t.yaml: |
    format: 1
    id: t
    title: T
    description: Test rule set.

    categories:
      c:
        title: C
        safety: review

    rules:
      - id: t.project
        when:
          contains: x
        action:
          pushScope:
            name: project
            set:
              project: "{name}"

      - id: t.claim
        when:
          name: a
          scope: { name: project, distance: 1 }
        action:
          claim: c

      - id: t.extra
        when: { name: z }
        action: { claim: { category: c, set: { p: "{scope.project.project}" } } }

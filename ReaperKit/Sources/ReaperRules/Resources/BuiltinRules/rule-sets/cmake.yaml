# yaml-language-server: $schema=../schema/rule-set.schema.json
format: 1
id: cmake
title: CMake
description: CMake build trees, recognised from the build side via CMakeCache.txt.

categories:
  build:
    title: CMake build directory
    detail: Out-of-source build tree whose source project still exists.
    safety: safe
  build-orphaned:
    title: CMake build directory (source gone)
    safety: safe
  in-source-files:
    title: CMake files in a source tree
    detail: In-source build; only CMake's own bookkeeping is offered, never the folder.
    safety: review

rules:
  # Searching for CMakeLists.txt and guessing build/ misses most out-of-source builds.
  # CMakeCache.txt names both itself and its source, so start from the build side.
  - id: cmake.in-source
    description: A source directory that also holds its own CMakeCache.txt.
    when:
      contains: [CMakeCache.txt, CMakeLists.txt]
      check: { name: cmake.cache, expect: { valid: true, inSource: true } }
    action:
      pushScope:
        name: in-source
        set:
          project: "{check.project}"

  - id: cmake.build
    description: An out-of-source build tree whose source still exists.
    when:
      contains: CMakeCache.txt
      check: { name: cmake.cache, expect: { valid: true, inSource: false, sourceExists: true } }
    action:
      claim:
        category: build
        set:
          project: "{check.project}"
          source: "{check.sourceDir}"

  - id: cmake.build-orphaned
    description: An out-of-source build tree whose source no longer exists.
    when:
      contains: CMakeCache.txt
      check: { name: cmake.cache, expect: { valid: true, inSource: false, sourceExists: false } }
    action:
      claim:
        category: build-orphaned
        set:
          project: "{check.project}"
          source: "{check.sourceDir}"

  - id: cmake.in-source-files
    description: CMakeFiles directly inside an in-source build.
    when:
      name: CMakeFiles
      scope: { name: in-source, distance: 1 }
    action:
      claim: in-source-files
